spring:
  application:
    name: saas-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/saas_platform
    username: saas_user
    password: saas_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

server:
  port: 8080


sendgrid:
