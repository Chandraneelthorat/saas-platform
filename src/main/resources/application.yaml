spring:
  application:
    name: saas-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/saas_platform
    username: saas_user
    password: saas_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080